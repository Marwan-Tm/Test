<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاينة حساب itch.io</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #141414;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #222222;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.4rem;
            color: #fa5c5c;
            margin-bottom: 6px;
        }

        .header p {
            color: #aaa;
            font-size: 0.85rem;
        }

        .login-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
            background: #1a1a1a;
            padding: 16px;
            border-radius: 8px;
            border: 1px dashed #444;
        }

        label {
            font-size: 0.85rem;
            color: #ccc;
        }

        input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #2b2b2b;
            color: #fff;
            outline: none;
            direction: ltr;
        }

        input:focus {
            border-color: #fa5c5c;
        }

        .btn {
            background-color: #fa5c5c;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            text-align: center;
        }

        .btn:hover {
            background-color: #e04b4b;
        }

        .btn-secondary {
            background-color: #333;
            margin-top: 6px;
        }

        .btn-secondary:hover {
            background-color: #444;
        }

        .profile-card {
            display: none;
            background: #1a1a1a;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #333;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid #fa5c5c;
            object-fit: cover;
        }

        .details h2 {
            font-size: 1.2rem;
            margin-bottom: 4px;
        }

        .details p {
            color: #888;
            font-size: 0.85rem;
        }

        .badge {
            display: inline-block;
            background: rgba(250, 92, 92, 0.15);
            color: #fa5c5c;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-top: 6px;
            border: 1px solid rgba(250, 92, 92, 0.3);
        }

        .section-title {
            font-size: 0.95rem;
            margin-bottom: 12px;
            border-bottom: 1px solid #333;
            padding-bottom: 6px;
            color: #ddd;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
        }

        .game-card {
            background: #2b2b2b;
            border-radius: 6px;
            overflow: hidden;
            text-align: center;
            font-size: 0.8rem;
            border: 1px solid #3a3a3a;
        }

        .game-card img {
            width: 100%;
            height: 70px;
            object-fit: cover;
        }

        .game-card span {
            display: block;
            padding: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status {
            margin-top: 10px;
            font-size: 0.85rem;
            text-align: center;
            color: #ffaa00;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>معاينة حساب itch.io</h1>
        <p>ربط وجلب معلومات المستخدم عبر API</p>
    </div>

    <!-- قسم إدخال البيانات والتسجيل -->
    <div class="login-box" id="loginBox">
        <label for="clientId">Client ID الخاص بتطبيقك:</label>
        <input type="text" id="clientId" placeholder="مثال: 16da4d900cef3e288c312b43f838ce45">

        <button class="btn" id="loginBtn">تسجيل الدخول عبر itch.io</button>

        <div style="text-align: center; margin: 8px 0; color: #666; font-size: 0.8rem;">— أو تجربة الشكل فوراً —</div>
        
        <button class="btn btn-secondary" onclick="loadMockData()">معاينة ببيانات وهمية (Demo)</button>
    </div>

    <div class="status" id="statusMsg"></div>

    <!-- كارت عرض البيانات المعادة من الـ API -->
    <div class="profile-card" id="profileCard">
        <div class="user-info">
            <img id="userAvatar" class="avatar" src="" alt="Avatar">
            <div class="details">
                <h2 id="userName">اسم المستخدم</h2>
                <p id="userId">المعرف: #0000</p>
                <span class="badge" id="userRole">مستخدم</span>
            </div>
        </div>

        <div class="section-title">الألعاب / المشاريع الخاصة به</div>
        <div class="games-grid" id="gamesGrid">
            <!-- سيتم توليد البطاقات هنا ديناميكياً -->
        </div>
    </div>
</div>

<script>
    const clientIdInput = document.getElementById('clientId');
    const loginBtn = document.getElementById('loginBtn');
    const profileCard = document.getElementById('profileCard');
    const loginBox = document.getElementById('loginBox');
    const statusMsg = document.getElementById('statusMsg');

    // 1. التوجيه إلى itch.io للمصادقة
    loginBtn.addEventListener('click', () => {
        const clientId = clientIdInput.value.trim();
        if (!clientId) {
            alert('يرجى أدخال Client ID الخاص بك أولاً!');
            return;
        }
        
        const redirectUri = encodeURIComponent(window.location.href.split('#')[0]);
        // ✅ السطر الصحيح المعدل:
const oauthUrl = `https://itch.io/user/oauth/authorize?client_id=${clientId}&scope=profile&response_type=token&redirect_uri=${redirectUri}`;

        
        window.location.href = oauthUrl;
    });

    // 2. فحص الرابط بعد العودة من itch.io لاستخراج الـ Token
    window.addEventListener('DOMContentLoaded', () => {
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const accessToken = params.get('access_token');

        if (accessToken) {
            fetchUserData(accessToken);
        }
    });

    // 3. جلب بيانات المستخدم الفعلية عبر API
    async function fetchUserData(token) {
        statusMsg.innerText = "جاري جلب البيانات من itch.io...";
        try {
            const response = await fetch(`https://itch.io/api/1/${token}/me`);
            const data = await response.json();

            if (data.user) {
                displayUser(data.user);
                fetchUserGames(token);
            } else {
                statusMsg.innerText = "فشل جلب البيانات. الرمز غير صالح.";
            }
        } catch (error) {
            statusMsg.innerText = "حدث خطأ في الاتصال (قد يتطلب خادم تجنباً لسياسة CORS).";
            console.error(error);
        }
    }

    // 4. جلب الألعاب الخاصة بالمستخدم
    async function fetchUserGames(token) {
        try {
            const response = await fetch(`https://itch.io/api/1/${token}/my-games`);
            const data = await response.json();
            if (data.games) {
                renderGames(data.games);
            }
        } catch (error) {
            console.error("خطأ أثناء جلب الألعاب:", error);
        }
    }

    // 5. طباعة البيانات في العناصر
    function displayUser(user) {
        loginBox.style.display = 'none';
        statusMsg.innerText = '';
        profileCard.style.display = 'block';

        document.getElementById('userName').innerText = user.display_name || user.username;
        document.getElementById('userId').innerText = `المعرف: #${user.id} (@${user.username})`;
        document.getElementById('userAvatar').src = user.cover_url || 'https://static.itch.io/images/default-user.png';
        document.getElementById('userRole').innerText = user.developer ? 'مطور ألعاب' : 'مستخدم عادي';
    }

    function renderGames(games) {
        const grid = document.getElementById('gamesGrid');
        grid.innerHTML = '';
        
        if (!games || games.length === 0) {
            grid.innerHTML = '<p style="font-size:0.8rem; color:#777; grid-column: 1/-1;">لا توجد ألعاب متوفرة</p>';
            return;
        }

        games.forEach(game => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.innerHTML = `
                <img src="${game.cover_url || 'https://via.placeholder.com/110x70'}" alt="${game.title}">
                <span>${game.title}</span>
            `;
            grid.appendChild(card);
        });
    }

    // 6. بيانات وهمية للعرض الفوري في أدوات المعاينة
    function loadMockData() {
        const mockUser = {
            id: 849201,
            username: "PlayerOne",
            display_name: "مروان",
            cover_url: "https://static.itch.io/images/default-user.png",
            developer: true
        };

        const mockGames = [
            { title: "Cyber Runner", cover_url: "https://via.placeholder.com/110x70/fa5c5c/ffffff?text=Game+1" },
            { title: "Pixel Quest", cover_url: "https://via.placeholder.com/110x70/333333/ffffff?text=Game+2" },
            { title: "Text Utility", cover_url: "https://via.placeholder.com/110x70/444444/ffffff?text=Tool" }
        ];

        displayUser(mockUser);
        renderGames(mockGames);
    }
</script>

</body>
</html>
